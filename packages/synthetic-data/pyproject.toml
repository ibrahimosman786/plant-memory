[project]
name = "pm-synth"
version = "0.1.0"
description = "Reproducible fictional pumping-station project generator with gold records for Plant Memory"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "python-docx>=1.1",
  "Pillow>=10.4",
]

[project.scripts]
pm-synth = "pm_synth.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
