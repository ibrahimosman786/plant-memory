name: Verify Plant Memory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EMBEDDING_BACKEND: hash
      VALKEY_URL: ""
      AUTH_BACKEND: dev
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pip install -e './packages/synthetic-data' -e './services/api[dev]'
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -f infra/docker/postgres-init/01-roles.sql
      - run: alembic upgrade head
        working-directory: services/api
      - run: python -m pm_synth.cli generate --out packages/synthetic-data/out --only v02
      - run: PM_RUN_INTEGRATION=1 pytest services/api/tests -q
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @plant-memory/web typecheck
      - run: pnpm --filter @plant-memory/web lint
